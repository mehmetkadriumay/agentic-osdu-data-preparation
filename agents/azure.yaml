# yaml-language-server: $schema=https://aka.ms/azure-dev/v1.0/azure.yaml.json
name: osdu-exploration-agents
requiredVersions:
  azd: ">=1.36.0"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.20"
    azure.ai.projects: ">=1.0.0-beta.14"
services:
  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
  approve-workspace:
    host: azure.ai.agent
    project: .
    language: docker
    uses: [ai-project]
    name: osdu-approve-workspace
    kind: hosted
    protocols: [{protocol: responses, version: 2.0.0}]
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    env:
      OSDU_STAGE: "1"
      OSDU_BACKEND_URL: ${OSDU_BACKEND_URL}
      OSDU_BACKEND_SCOPE: ${OSDU_BACKEND_SCOPE}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  discover-formats:
    host: azure.ai.agent
    project: .
    language: docker
