repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy
        name: Strict mypy
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false
      - id: pytest
        name: Pytest with coverage
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false
      - id: bandit
        name: Bandit
        entry: uv run --frozen bandit -c pyproject.toml -r src
        language: system
        pass_filenames: false
      - id: uv-lock
        name: Frozen uv lock
        entry: uv lock --check
        language: system
        pass_filenames: false
