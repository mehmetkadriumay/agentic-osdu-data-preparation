[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agentic-osdu-data-preparation"
version = "0.1.0"
description = "Local-first agentic tools for preparing OSDU data."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Mehmet Kadri Umay" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "alembic>=1.16,<2",
    "dlisio>=1,<2",
    "fastapi>=0.116,<1",
    "ijson>=3.3,<4",
    "jsonschema[format]>=4.23,<5",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
agentic-osdu = "agentic_osdu.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/mehmetkadriumay/agentic-osdu-data-preparation"
Repository = "https://github.com/mehmetkadriumay/agentic-osdu-data-preparation"
Issues = "https://github.com/mehmetkadriumay/agentic-osdu-data-preparation/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_osdu"]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8,<2",
    "build>=1.2,<2",
    "hatchling==1.27.0",
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
    "pre-commit>=4,<5",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "twine>=6,<7",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=agentic_osdu",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["agentic_osdu"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@overload",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "PIE",
    "PT",
    "RUF",
    "SIM",
]
ignore = [
    "COM812",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
exclude = ["build", "dist", "\\.venv"]
show_error_codes = true
show_column_numbers = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = []
